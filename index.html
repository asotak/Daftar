; accent-color: var(--accent); }\n.br { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; align-items: end; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }\n.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }\n.jump { align-self: flex-start; }\n/* نتیجه */\n.hero { display: flex; flex-direction: column; gap: 2px; }\n.hero .big { font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--accent); }\n.hero .lab { color: var(--muted); font-size: 13px; }\ndl.sum { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; margin: 10px 0 0; font-size: 14px; }\ndl.sum dt { color: var(--muted); }\ndl.sum dd { margin: 0; font-variant-numeric: tabular-nums; text-align: left; }\n.stackbar { display: flex; height: 14px; border-radius: 7px; overflow: hidden; background: var(--surface2); margin: 14px 0 8px; direction: rtl; }\n.stackbar i { display: block; height: 100%; }\n.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--muted); }\n.legend b { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-inline-end: 5px; vertical-align: -1px; }\n.tbl-wrap { overflow-x: auto; margin-top: 12px; }\ntable { width: 100%; border-collapse: collapse; font-size: 14px; }\nth { text-align: right; font-size: 12.5px; color: var(--muted); font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }\ntd { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; }\ntd.n, th.n { text-align: left; font-variant-numeric: tabular-nums; white-space: nowrap; }\ntd .basis { display: block; color: var(--muted); font-size: 12px; line-height: 1.6; }\n.fr { direction: ltr; unicode-bidi: isolate; display: inline-block; font-weight: 600; }\n.of { display: block; color: var(--muted); font-size: 11.5px; }\ntr.total td { font-weight: 800; border-bottom: 0; }\n.dot { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-inline-end: 7px; }\n.alert { background: var(--warn-soft); color: var(--warn); border-radius: 8px; padding: 9px 12px; font-size: 13.5px; line-height: 1.8; }\n.alert + .alert { margin-top: 6px; }\nul.notes { margin: 6px 0 0; padding-inline-start: 18px; color: var(--ink); font-size: 13.5px; line-height: 1.85; }\n.muted { color: var(--muted); font-size: 13px; }\n.empty { color: var(--muted); padding: 18px 0; text-align: center; }\n.toast { color: var(--accent); font-weight: 600; font-size: 13px; }\ntextarea.rep { width: 100%; min-height: 140px; font: inherit; direction: rtl; background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 8px; }\n.foot { margin-top: 22px; color: var(--muted); font-size: 12.5px; line-height: 1.9; }\n@media print { .noprint { display: none !important; } .results { position: static; max-height: none; } .grid { display: block; } body { background: #fff; color: #000; } }\n@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }\nbody { margin: 0; }\n<\/style>\n<\/head>\n<body>\n\n<div id=\"app\" dir=\"rtl\" lang=\"fa\" class=\"wrap\">\n  <h1>محاسبه‌گر سهم‌الارث<\/h1>\n  <p class=\"sub\">بر پایه مواد ۸۶۱ تا ۹۴۹ قانون مدنی - طبقات سه‌گانه، همسر، رد و نقص، حبوه، خنثی، موانع ارث، دیون و وصیت<\/p>\n\n  <div class=\"grid\">\n    <div class=\"stack\" id=\"inputs\">\n      <button type=\"button\" class=\"ghost jump\" id=\"jump\">رفتن به نتیجه<\/button>\n\n      <section class=\"card stack\">\n        <div class=\"toolbar\">\n          <h2 style=\"margin:0\">متوفی و قانون حاکم<\/h2>\n          <button type=\"button\" class=\"ghost noprint\" id=\"reset\">پاک‌کردن همه<\/button>\n        <\/div>\n        <div class=\"two\">\n          <div class=\"field\"><span>جنسیت متوفی<\/span>\n            <div class=\"seg\" role=\"radiogroup\" aria-label=\"جنسیت متوفی\">\n              <label><input type=\"radio\" name=\"sex\" value=\"m\" checked><span>مرد<\/span><\/label>\n              <label><input type=\"radio\" name=\"sex\" value=\"f\"><span>زن<\/span><\/label>\n            <\/div>\n          <\/div>\n          <div class=\"field\"><span>زمان فوت<\/span>\n            <div class=\"seg\" role=\"radiogroup\" aria-label=\"زمان فوت\">\n              <label><input type=\"radio\" name=\"law\" value=\"new\" checked><span>پس از ۱۳۸۷/۱۱/۶<\/span><\/label>\n              <label><input type=\"radio\" name=\"law\" value=\"old\"><span>پیش از آن<\/span><\/label>\n            <\/div>\n          <\/div>\n        <\/div>\n        <p class=\"muted\" style=\"margin:0\">قانون زمان فوت بر ارث حاکم است. پس از اصلاح ۱۳۸۷ زوجه از قیمت همه اموال غیرمنقول ارث می‌برد و پیش از آن از عرصه محروم بود.<\/p>\n      <\/section>\n\n      <section class=\"card stack\">\n        <h2 style=\"margin:0\">ترکه<\/h2>\n        <div class=\"field\"><span>واحد پول<\/span>\n          <select id=\"unit\"><option>تومان<\/option><option>ریال<\/option><\/select>\n        <\/div>\n        <div class=\"two\">\n          <label class=\"field\"><span>اموال منقول - نقد، خودرو، سهام و ...<\/span><input type=\"text\" inputmode=\"numeric\" class=\"money\" id=\"m-movable\" data-money=\"movable\" autocomplete=\"off\"><\/label>\n          <label class=\"field\"><span>عرصه - زمین<\/span><input type=\"text\" inputmode=\"numeric\" class=\"money\" id=\"m-land\" data-money=\"land\" autocomplete=\"off\"><\/label>\n          <label class=\"field\"><span>اعیان - ساختمان و اشجار<\/span><input type=\"text\" inputmode=\"numeric\" class=\"money\" id=\"m-building\" data-money=\"building\" autocomplete=\"off\"><\/label>\n          <label class=\"field\"><span>دیون - از جمله مهریه باقی‌مانده<\/span><input type=\"text\" inputmode=\"numeric\" class=\"money\" id=\"m-debts\" data-money=\"debts\" autocomplete=\"off\"><\/label>\n          <label class=\"field\"><span>هزینه کفن و دفن و مراسم متعارف<\/span><input type=\"text\" inputmode=\"numeric\" class=\"money\" id=\"m-funeral\" data-money=\"funeral\" autocomplete=\"off\"><\/label>\n          <label class=\"field\"><span>وصیت مالی - به وارث یا غیر وارث<\/span><input type=\"text\" inputmode=\"numeric\" class=\"money\" id=\"m-will\" data-money=\"will\" autocomplete=\"off\"><\/label>\n        <\/div>\n        <p class=\"muted\" style=\"margin:0\">ترتیب کسر: کفن و دفن، دیون، وصیت تا یک‌سوم باقی‌مانده، سپس تقسیم میان ورثه.<\/p>\n      <\/section>\n\n      <label class=\"chk noprint\" style=\"padding:0 4px\"><input type=\"checkbox\" id=\"showBar\"><span>نمایش ستون ممنوع از ارث - قاتل، کافر، ولد زنا، ملاعنه - برای هر ردیف<\/span><\/label>\n\n      <details class=\"card\" open id=\"d-spouse\"><summary>همسر<\/summary><div class=\"body\" id=\"g-spouse\"><\/div><\/details>\n      <details class=\"card\" open id=\"d-c1\"><summary>طبقه اول - پدر و مادر و فرزندان و نوادگان<\/summary><div class=\"body\">\n        <p class=\"cls-note\">با وجود یک نفر از این طبقه، طبقه‌های بعد ارث نمی‌برند.<\/p>\n        <div id=\"g-c1\"><\/div>\n        <div class=\"stack\" style=\"margin-top:10px\">\n          <strong>فرزندان فوت‌شده که فرزند دارند - نوه‌ها<\/strong>\n          <span class=\"muted\">فقط وقتی فرزند بلاواسطه در قید حیات نیست محاسبه می‌شود. هر نوه جای والد متوفی خود را می‌گیرد.<\/span>\n          <div id=\"branches\" class=\"stack\"><\/div>\n          <button type=\"button\" class=\"ghost\" id=\"addBranch\" style=\"align-self:flex-start\">افزودن فرزند فوت‌شده<\/button>\n        <\/div>\n      <\/div><\/details>\n      <details class=\"card\" id=\"d-c2\"><summary>طبقه دوم - اجداد و خواهر و برادر و فرزندان آنان<\/summary><div class=\"body\"><p class=\"cls-note\">خواهر و برادر ابوینی، خواهر و برادر ابی را محروم می‌کنند ولی خواهر و برادر امی را نه.<\/p><div id=\"g-c2\"><\/div><\/div><\/details>\n      <details class=\"card\" id=\"d-c3\"><summary>طبقه سوم - عمو و عمه و دایی و خاله و فرزندان آنان<\/summary><div class=\"body\"><p class=\"cls-note\">فرزندان عمو و دایی فقط در نبود خود آنان وارد می‌شوند.<\/p><div id=\"g-c3\"><\/div><\/div><\/details>\n\n      <section class=\"card stack\" id=\"habwaCard\" hidden>\n        <h2 style=\"margin:0\">حبوه - ماده ۹۱۵<\/h2>\n        <label class=\"chk\"><input type=\"checkbox\" id=\"habwaOn\"><span>اعمال حبوه برای پسر بزرگ‌تر<\/span><\/label>\n        <label class=\"field\"><span>ارزش انگشتر، قرآن، شمشیر و لباس‌های شخصی متوفی<\/span><input type=\"text\" inputmode=\"numeric\" class=\"money\" id=\"habwaVal\" autocomplete=\"off\"><\/label>\n        <p class=\"muted\" style=\"margin:0\">شرایط: متوفی پدر باشد، ترکه منحصر به این اموال نباشد، دین مستغرق نباشد، به این اعیان وصیت نشده باشد و از سهم پسر بزرگ‌تر کسر نمی‌شود. پسر اول فهرست، پسر بزرگ‌تر فرض می‌شود.<\/p>\n      <\/section>\n    <\/div>\n\n    <aside class=\"stack results\" id=\"results\" aria-live=\"polite\"><\/aside>\n  <\/div>\n\n  <p class=\"foot\">این ابزار برای کمک به محاسبه است و جای بررسی نهایی وکیل را نمی‌گیرد. خنثی، نوادگان چندنسلی، فرزندان خواهر و برادر و فرزندان عمو و دایی با ساده‌سازی محاسبه می‌شوند و در پرونده‌های پیچیده باید با متن قانون و گواهی حصر وراثت تطبیق شوند.<\/p>\n<\/div>\n\n<script>\n/* موتور محاسبه سهم‌الارث — قانون مدنی ایران، مواد ۸۶۱ تا ۹۴۹ */\n(function (root) {\n  'use strict';\n\n  /* ---------- کسر دقیق با BigInt ---------- */\n  const gcd = (a, b) => { a = a < 0n ? -a : a; b = b < 0n ? -b : b; while (b) { [a, b] = [b, a % b]; } return a; };\n  function Fr(n, d) {\n    n = BigInt(n); d = d === undefined ? 1n : BigInt(d);\n    if (d < 0n) { n = -n; d = -d; }\n    const g = gcd(n, d) || 1n;\n    return { n: n / g, d: d / g };\n  }\n  const add = (a, b) => Fr(a.n * b.d + b.n * a.d, a.d * b.d);\n  const sub = (a, b) => Fr(a.n * b.d - b.n * a.d, a.d * b.d);\n  const mul = (a, b) => Fr(a.n * b.n, a.d * b.d);\n  const div = (a, b) => Fr(a.n * b.d, a.d * b.n);\n  const cmp = (a, b) => { const x = a.n * b.d, y = b.n * a.d; return x < y ? -1 : x > y ? 1 : 0; };\n  const ZERO = Fr(0n), ONE = Fr(1n);\n  const isZero = (a) => a.n === 0n;\n  const fr = (n, d) => Fr(BigInt(n), BigInt(d));\n  const num = (a) => Number(a.n) / Number(a.d);\n  const W1 = Fr(1n), W2 = Fr(2n), WK = Fr(3n, 2n);\n  const nm = (base, i, n) => (n > 1 ? base + ' ' + i : base);\n  const mk = (prefix, n, base, w) => Array.from({ length: n }, (_, i) => ({ key: prefix + '_' + (i + 1), label: nm(base, i + 1, n), w }));\n\n  /* ---------- محاسبه اصلی ---------- */\n  function compute(inp, opts) {\n    opts = opts || {};\n    const kAs = opts.kAs;\n    const c = (k) => Math.max(0, (+inp.c[k] || 0) - (+(inp.b && inp.b[k]) || 0));\n    const male = inp.sex !== 'f';\n    const rows = [], notes = [], excluded = [];\n    const give = (key, label, share, basis, group) => { if (!isZero(share)) rows.push({ key, label, share, basis: basis || '', group }); };\n    const spread = (members, total, basis, group) => {\n      if (isZero(total) || !members.length) return;\n      let W = ZERO; members.forEach((m) => { W = add(W, m.w); });\n      members.forEach((m) => give(m.key, m.label, mul(total, div(m.w, W)), basis, group));\n    };\n\n    /* فرزندان و نوادگان */\n    const sons = c('son'), dau = c('dau'), kc = c('kc');\n    const direct = sons + dau + kc > 0;\n    const allBranches = (inp.branches || []).map((b, i) => ({ sex: b.sex, boys: Math.max(0, +b.boys || 0), girls: Math.max(0, +b.girls || 0), idx: i + 1 }));\n    const branches = direct ? [] : allBranches.filter((b) => b.boys + b.girls > 0);\n    if (direct && allBranches.some((b) => b.boys + b.girls > 0)) excluded.push('نوه‌ها با وجود فرزند بلاواسطه ارث نمی‌برند - ماده ۸۶۲ و ۸۶۳.');\n    const hasDesc = direct || branches.length > 0;\n\n    /* همسر */\n    const nSp = male ? c('wife') : Math.min(1, c('husband'));\n    const sF = male ? (hasDesc ? fr(1, 8) : fr(1, 4)) : (hasDesc ? fr(1, 4) : fr(1, 2));\n    const sFtxt = male ? (hasDesc ? 'یک‌هشتم' : 'یک‌چهارم') : (hasDesc ? 'یک‌چهارم' : 'نصف');\n    const s = nSp > 0 ? sF : ZERO;\n    const giveSpouse = (share) => {\n      for (let i = 1; i <= nSp; i++) {\n        give('sp_' + i, male ? nm('زوجه', i, nSp) : 'شوهر', div(share, Fr(BigInt(nSp))),\n          (male ? 'زوجه' : 'شوهر') + ' - ' + sFtxt + (male && nSp > 1 ? ' میان زوجات بالسویه' : '') + ' - ماده ۹۴۶', 'spouse');\n      }\n    };\n\n    /* پدر و مادر و حاجب‌ها */\n    const f = Math.min(1, c('father')), m = Math.min(1, c('mother'));\n    const fb = c('fb'), fs = c('fs'), fk = c('fk'), pb = c('pb'), ps = c('ps'), mt = c('mt');\n    const brothers = fb + pb, sisters = fs + ps;\n    const blocker = f === 1 && (brothers >= 2 || (brothers >= 1 && sisters >= 2) || sisters >= 4);\n    const class1 = f + m > 0 || hasDesc;\n\n    /* ========== طبقه اول ========== */\n    if (class1) {\n      let fS = ZERO, mS = ZERO;\n      const pBasis = (x) => x;\n      if (!hasDesc) {\n        if (f && m) {\n          mS = blocker ? fr(1, 6) : fr(1, 3);\n          fS = sub(sub(ONE, s), mS);\n          if (blocker) notes.push('مادر به‌دلیل وجود حاجب - دو برادر یا یک برادر و دو خواهر یا چهار خواهر ابوینی یا ابی در حضور پدر - یک‌ششم می‌برد و مازاد به پدر می‌رسد.');\n          else notes.push('با پدر و مادر و بدون فرزند: مادر یک‌سوم از کل ترکه و باقی با پدر است - ماده ۹۰۶.');\n        } else if (f) { fS = sub(ONE, s); }\n        else if (m) { mS = sub(ONE, s); if (nSp) notes.push('مادر به‌تنهایی با همسر: باقی‌مانده به مادر رد می‌شود و همسر رد نمی‌گیرد.'); }\n        giveSpouse(s);\n        give('father', 'پدر', fS, f && m ? 'پدر - باقی‌مانده پس از سهم مادر و همسر - ماده ۹۰۶' : 'پدر - تمام یا باقی‌مانده ترکه - ماده ۹۰۶', 'parents');\n        give('mother', 'مادر', mS, m && f ? (blocker ? 'مادر - یک‌ششم با وجود حاجب' : 'مادر - یک‌سوم - ماده ۹۰۶') : 'مادر - تمام یا باقی‌مانده ترکه - ماده ۹۰۶', 'parents');\n      } else {\n        const pF = f ? fr(1, 6) : ZERO, pM = m ? fr(1, 6) : ZERO;\n        const units = [];\n        if (direct) {\n          mk('son', sons, 'پسر', W2).forEach((u) => units.push({ ...u, male: true, group: 'children', basis: 'پسر - دو برابر دختر - ما       '<section class="card stack"><h2 style="margin:0">پشتیبان‌گیری</h2><p class="muted" style="margin:0">داده‌ها فقط روی همین دستگاه و همین مرورگر ذخیره می‌شوند. با پاک‌کردن اطلاعات مرورگر یا تعویض گوشی از بین می‌روند، پس هر چند وقت یک‌بار پشتیبان بگیرید.' + (DB.lastBackup ? ' آخرین پشتیبان: ' + fa(new Date(DB.lastBackup).toLocaleDateString('fa-IR')) + '.' : '') + '</p>' +
      '<div class="btns"><button class="btn primary" data-act="export">گرفتن پشتیبان</button></div><textarea class="big" id="bk-out" readonly hidden aria-label="متن پشتیبان"></textarea></section>' +
      '<section class="card stack"><h2 style="margin:0">بازیابی</h2><p class="muted" style="margin:0">فایل پشتیبان را انتخاب کنید یا متن آن را اینجا بچسبانید. بازیابی، اطلاعات فعلی را جایگزین می‌کند.</p><label class="field"><span>فایل پشتیبان</span><input type="file" id="bk-file" accept=".json,application/json"></label><label class="field"><span>یا متن پشتیبان</span><textarea class="big" id="bk-in"></textarea></label><div class="btns">' + (ui.confirm === 'imp' ? '<button class="btn danger" data-act="doimport">تأیید جایگزینی</button><button class="btn" data-act="cancel">انصراف</button>' : '<button class="btn" data-act="import">بازیابی از متن</button>') + '</div></section>' +
      '<section class="card stack"><h2 style="margin:0">ماشین‌حساب سهم‌الارث</h2><p class="muted" style="margin:0">محاسبه‌ی مستقل، بدون ذخیره. برای ذخیره در پرونده، از صفحه‌ی همان پرونده و تب «ارث» استفاده کنید.</p><div class="btns"><button class="btn primary" data-act="inhopen">باز کردن</button></div></section>' +
      '<section class="card stack"><h2 style="margin:0">نصاب تجدیدنظر</h2><p class="muted" style="margin:0">طبق متن ماده ۳۳۱ آ.د.م، دعاوی مالی با خواسته بیش از سه میلیون ریال، یعنی ۳۰۰٬۰۰۰ تومان، قابل تجدیدنظر است. اگر این مبلغ در قانون جاری تغییر کرده، اینجا اصلاح شود تا راهنمای اعتراض بر همان اساس کار کند.</p>' + field('lim', 'نصاب - تومان', money(DB.limit), 'data-limit class="ltr" inputmode="numeric"') + '</section>' +
      '<section class="card stack"><h2 style="margin:0">وضعیت خودکار پرونده‌ها</h2><p class="muted" style="margin:0">پرونده‌ای که مهلت بازش از این تعداد روز نزدیک‌تر باشد قرمز می‌شود، و پرونده‌ای که بدون مهلت و جلسه‌ی باز این مدت دست نخورد راکد حساب می‌شود.</p><div class="two">' + field('nr', 'مهلت نزدیک - روز', fa(DB.near), 'data-near class="ltr" inputmode="numeric"') + field('id', 'راکد پس از - روز', fa(DB.idle), 'data-idle class="ltr" inputmode="numeric"') + '</div></section>' +
      '<section class="card stack"><h2 style="margin:0">حریم خصوصی</h2><p class="muted" style="margin:0">اطلاعات موکلین جایی ارسال نمی‌شود. با این حال هر کس به این دستگاه یا فایل پشتیبان دسترسی داشته باشد آن‌ها را می‌بیند؛ از قفل گوشی استفاده کنید و فایل پشتیبان را امن نگه دارید.</p></section>' +
      '<section class="card stack"><h2 style="margin:0">پاک‌کردن همه</h2><div class="btns">' + (ui.confirm === 'wipe' ? '<button class="btn danger" data-act="dowipe">تأیید - همه پرونده‌ها پاک شود</button><button class="btn" data-act="cancel">انصراف</button>' : '<button class="btn danger" data-act="wipe">پاک‌کردن همه اطلاعات</button>') + '</div></section>' +
      '<p class="muted">مهلت‌ها با متن آ.د.م، آ.د.ک، قانون اجرای احکام مدنی و قانون حمایت خانواده تطبیق داده شده است. مهلت‌های قانون صدور چک از منبع آنلاین است. این برنامه جایگزین بررسی وکیل نیست.</p></div>';
  }
  function render() {
    var c = ui.caseId && cById(ui.caseId), v;
    if (ui.tab === 'cases' && c) v = viewCase(c);
    else if (ui.tab === 'today') v = viewToday();
    else if (ui.tab === 'cases') v = viewCases();
    else if (ui.tab === 'calc') v = viewCalc();
    else if (ui.tab === 'inhcalc') v = '<div class="top"><button class="btn sm" data-act="tab" data-t="more">بازگشت</button><h1>ماشین‌حساب ارث</h1></div><div class="stack">' + inhFrameHtml(false) + '</div>';
    else v = viewMore();
    var tabs = [['today', 'امروز'], ['cases', 'پرونده‌ها'], ['calc', 'مهلت‌یاب'], ['more', 'بیشتر']];
    app.innerHTML = '<div id="view">' + v + '</div><nav class="bar" aria-label="بخش‌ها"><div class="in">' + tabs.map(function (t) { return '<button data-act="tab" data-t="' + t[0] + '"' + (ui.tab === t[0] ? ' aria-current="page"' : '') + '>' + t[1] + '</button>'; }).join('') + '</div></nav>';
    if (ui.preRule) { var pr = document.getElementById('cd-rule'); if (pr) { pr.value = ui.preRule; } ui.preRule = ''; }
    ['calc', 'cd'].forEach(updatePrev);
    updateClaimForm();
    setupInh();
  }
  function go(tab, caseId, sub) { ui.tab = tab; ui.caseId = caseId || null; if (sub) ui.sub = sub; ui.confirm = ''; render(); window.scrollTo(0, 0); }

  /* ---------- رویدادها ---------- */
  function formVals(l) { var root = app.querySelector('[data-form="' + l + '"]'), o = {}; root.querySelectorAll('[data-k]').forEach(function (e) { o[e.getAttribute('data-k')] = e.value; }); return o; }
  app.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]'); if (!b) return;
    var a = b.getAttribute('data-act'), c = ui.caseId && cById(ui.caseId);
    if (a === 'tab') go(b.getAttribute('data-t'));
    else if (a === 'open') go('cases', b.getAttribute('data-id'), 'info');
    else if (a === 'opendl') go('cases', b.getAttribute('data-id'), 'dl');
    else if (a === 'sumview') { ui.sub = 'print'; render(); window.scrollTo(0, 0); }
    else if (a === 'sumback') { ui.sub = 'info'; render(); window.scrollTo(0, 0); }
    else if (a === 'doprint') { try { window.print(); } catch (e) { toast('از منوی مرورگر گزینه چاپ را بزنید'); } }
    else if (a === 'copysum' && c) {
      var txt = summaryText(c), ta = document.getElementById('sum-text');
      var fb = function () { ta.hidden = false; ta.value = txt; ta.focus(); ta.select(); toast('متن را انتخاب و کپی کنید'); };
      try { navigator.clipboard.writeText(txt).then(function () { toast('کپی شد'); }, fb); } catch (e2) { fb(); }
    }
    else if (a === 'opensess') go('cases', b.getAttribute('data-id'), 'sess');
    else if (a === 'back') go('cases');
    else if (a === 'sub') { ui.sub = b.getAttribute('data-s'); ui.confirm = ''; render(); }
    else if (a === 'inhon' && c) { c.inhOn = true; save(); ui.sub = 'inh'; render(); window.scrollTo(0, 0); }
    else if (a === 'inhopen') { ui.tab = 'inhcalc'; ui.caseId = null; render(); window.scrollTo(0, 0); }
    else if (a === 'gotodl') { ui.sub = 'dl'; ui.preRule = b.getAttribute('data-r'); ui.confirm = ''; render(); window.scrollTo(0, 0); }
    else if (a === 'fs') { ui.fs = b.getAttribute('data-v'); render(); }
    else if (a === 'newcase') { var n = blankCase(); DB.cases.unshift(n); save(); go('cases', n.id, 'info'); }
    else if (a === 'askdel') { ui.confirm = 'del'; render(); }
    else if (a === 'cancel') { ui.confirm = ''; render(); }
    else if (a === 'delcase') { DB.cases = DB.cases.filter(function (x) { return x.id !== ui.caseId; }); save(); toast('پرونده حذف شد'); go('cases'); }
    else if (a === 'add' && c) {
      var l = b.getAttribute('data-l'), v = formVals(l), dt = D.parse(v.date);
      if (l === 'claims') {
        if (!v.title.trim()) return toast('عنوان خواسته را بنویسید');
        var fin = v.kind === 'مالی';
        c.claims.push({ id: uid(), kind: v.kind, title: v.title.trim(), subject: fin ? v.subject : 'غیرمالی', value: fin ? parseNum(v.value) : 0, prop: (fin && PROPS.indexOf(v.subject) >= 0) ? { plaque: v.plaque.trim(), area: parseNum(v.area), addr: v.addr.trim(), doc: v.doc } : null });
      }
      if (l === 'parties') {
        if (!v.name.trim()) return toast('نام را بنویسید');
        var nidv = faToEn(v.nid || '').replace(/\D/g, ''); if (nidv && !nidOK(nidv)) return toast('کد ملی معتبر نیست - خالی بگذارید یا اصلاح کنید');
        var hit = elsewhere(v.name, c);
        c.parties.push({ id: uid(), name: v.name.trim(), role: v.role, ours: v.ours === 'بله', phone: faToEn(v.phone || '').trim(), nid: nidv, note: (v.note || '').trim() });
        save(); render(); return toast(hit.length ? 'ثبت شد - این نام در پرونده دیگر هم هست: ' + hit.join('، ') : 'ثبت شد');
      }
      if (l === 'events') { if (!v.title.trim()) return toast('عنوان را بنویسید'); if (dt == null) return toast('تاریخ نامعتبر است'); c.events.push({ id: uid(), date: dt, title: v.title.trim() }); }
      if (l === 'sessions') { if (dt == null) return toast('تاریخ نامعتبر است'); c.sessions.push({ id: uid(), date: dt, time: v.time.trim(), place: v.place.trim(), note: v.note.trim(), done: false }); }
      if (l === 'notes') { if (!v.text.trim()) return toast('متن را بنویسید'); if (dt == null) return toast('تاریخ نامعتبر است'); c.notes.push({ id: uid(), date: dt, kind: v.kind, text: v.text.trim() }); }
      if (l === 'docs') { if (!v.name.trim()) return toast('عنوان مدرک را بنویسید'); c.docs.push({ id: uid(), name: v.name.trim(), kind: v.kind, status: v.status, where: v.where.trim() }); }
      if (l === 'payments' || l === 'expenses') { var am = parseNum(v.amount); if (!am) return toast('مبلغ را بنویسید'); if (dt == null) return toast('تاریخ نامعتبر است'); c[l].push({ id: uid(), date: dt, amount: am, note: v.note.trim(), who: v.who }); }
      save(); render(); toast('ثبت شد');
    }
    else if (a === 'rm' && c) { var ll = b.getAttribute('data-l'); c[ll] = c[ll].filter(function (x) { return x.id !== b.getAttribute('data-id'); }); save(); render(); }
    else if (a === 'done' && c) { (c[b.getAttribute('data-l') || 'deadlines']).forEach(function (d) { if (d.id === b.getAttribute('data-id')) d.done = !d.done; }); save(); render(); }
    else if (a === 'adddl') {
      var p = b.getAttribute('data-p'), x = readDl(p); if (x.err) return toast(x.err);
      var cid = p === 'calc' ? x.caseId : ui.caseId; if (!cid) return toast('برای ثبت، یک پرونده انتخاب کنید');
      var tc = cById(cid); if (!tc) return;
      tc.deadlines.push({ id: uid(), title: x.rule.custom ? (x.ctitle.trim() || 'مهلت دلخواه') : x.rule.t, ruleId: x.rule.id, start: x.start, end: x.r.end, ref: x.rule.ref, ver: x.rule.ver, note: x.note.trim(), done: false });
      save(); toast('مهلت ثبت شد'); if (p === 'calc') render(); else render();
    }
    else if (a === 'export') {
      DB.lastBackup = Date.now(); save();
      var json = JSON.stringify(DB), ta = document.getElementById('bk-out'); ta.hidden = false; ta.value = json; ta.focus(); ta.select();
      try { var u = URL.createObjectURL(new Blob([json], { type: 'application/json' })), an = document.createElement('a'); an.href = u; an.download = 'daftar-parvandeh-backup.json'; document.body.appendChild(an); an.click(); an.remove(); } catch (er) {}
      try { navigator.clipboard.writeText(json).then(function () { toast('پشتیبان کپی شد و فایل ساخته شد'); }, function () { toast('متن پشتیبان را انتخاب و کپی کنید'); }); } catch (er2) { toast('متن پشتیبان را انتخاب و کپی کنید'); }
    }
    else if (a === 'import') { ui.confirm = 'imp'; var keep = document.getElementById('bk-in').value; render(); document.getElementById('bk-in').value = keep; }
    else if (a === 'doimport') {
      try { var o = JSON.parse(document.getElementById('bk-in').value); if (!o || !Array.isArray(o.cases)) throw 0; DB = o; normalize(); save(); ui.confirm = ''; toast('بازیابی شد'); render(); } catch (er3) { ui.confirm = ''; render(); toast('متن پشتیبان معتبر نیست'); }
    }
    else if (a === 'wipe') { ui.confirm = 'wipe'; render(); }
    else if (a === 'dowipe') { DB = { cases: [], lastBackup: 0 }; save(); ui.confirm = ''; toast('همه اطلاعات پاک شد'); render(); }
  });

  /* قالب‌بندی خودکار تاریخ و ساعت: فقط رقم بزنید، / و : خودکار می‌آید */
  function faToEn(v) { return String(v).replace(/[۰-۹]/g, function (d) { return '۰۱۲۳۴۵۶۷۸۹'.indexOf(d); }).replace(/[٠-٩]/g, function (d) { return '٠١٢٣٤٥٦٧٨٩'.indexOf(d); }); }
  /* رقم‌های اضافه‌ی هر بخش به بخش بعدی می‌رود، مثلاً 1405/082 می‌شود 1405/08/2 */
  function spill(parts, lim) {
    for (var i = 0; i < lim.length; i++) {
      if (parts[i] != null && parts[i].length > lim[i]) { var ex = parts[i].slice(lim[i]); parts[i] = parts[i].slice(0, lim[i]); if (i + 1 < lim.length) parts[i + 1] = ex + (parts[i + 1] || ''); }
    }
    return parts.slice(0, lim.length).join(lim.length === 3 ? '/' : ':');
  }
  function fmtDateInput(v) {
    v = faToEn(v).replace(/[^0-9\/\-.\s]/g, '').replace(/[\-.\s]+/g, '/').replace(/\/+/g, '/');
    if (v.indexOf('/') < 0) {
      var d = v.slice(0, 8);
      return d.length > 6 ? d.slice(0, 4) + '/' + d.slice(4, 6) + '/' + d.slice(6) : d.length > 4 ? d.slice(0, 4) + '/' + d.slice(4) : d;
    }
    return spill(v.split('/'), [4, 2, 2]);
  }
  function fmtTimeInput(v) {
    v = faToEn(v).replace(/[^0-9:.\/\s]/g, '').replace(/[.\/\s]+/g, ':').replace(/:+/g, ':');
    if (v.indexOf(':') < 0) { var d = v.slice(0, 4); return d.length > 2 ? d.slice(0, 2) + ':' + d.slice(2) : d; }
    return spill(v.split(':'), [2, 2]);
  }
  app.addEventListener('input', function (e) {
    var el = e.target, c = ui.caseId && cById(ui.caseId);
    if (el.hasAttribute && (el.hasAttribute('data-date') || el.hasAttribute('data-time'))) { var nv = el.hasAttribute('data-date') ? fmtDateInput(el.value) : fmtTimeInput(el.value); if (nv !== el.value) el.value = nv; }
    if (el.id === 'cl-title') {
      var kk = CLAIM_KIND_N[normT(el.value)], ks = document.getElementById('cl-kind');
      if (kk && ks && ks.value !== kk) { ks.value = kk; toast('ماهیت طبق فهرست خواسته‌ها: ' + kk); }
    }
    if (el.id === 'cl-title' || el.id === 'cl-val') updateClaimForm();
    if (el.hasAttribute('data-dlnote') && c) { c.deadlines.forEach(function (d) { if (d.id === el.getAttribute('data-dlnote')) d.note = el.value; }); save(); return; }
    if (el.hasAttribute('data-near')) { var nn = parseNum(el.value); if (nn > 0 && nn < 100) { DB.near = nn; save(); } return; }
    if (el.hasAttribute('data-idle')) { var ni = parseNum(el.value); if (ni > 0 && ni < 1000) { DB.idle = ni; save(); } return; }
    if (el.id === 'q') { ui.q = el.value; document.getElementById('caseList').innerHTML = caseListHtml(); return; }
    if (el.hasAttribute('data-f') && c) { c[el.getAttribute('data-f')] = el.value; save(); if (el.id === 'f-branch' || el.id === 'f-crime') { render(); return; } if (el.id === 'f-phone') { var cl = document.getElementById('call-links'); if (cl) cl.innerHTML = callLinks(el.value); } }
    else if (el.hasAttribute('data-in') && c) { c.intake[el.getAttribute('data-in')] = el.value; save(); }
    else if (el.hasAttribute('data-limit')) { var nl = parseNum(el.value); if (nl > 0) { DB.limit = nl; save(); } }
    else if (el.hasAttribute('data-fee') && c) { c.fee = parseNum(el.value); save(); var kv = document.getElementById('kv'); if (kv) kv.innerHTML = kvHtml(c); }
    var f = el.closest('[data-form]'); if (f && (f.getAttribute('data-form') === 'calc' || f.getAttribute('data-form') === 'cd')) updatePrev(f.getAttribute('data-form'));
  });
  app.addEventListener('change', function (e) {
    var el = e.target, c = ui.caseId && cById(ui.caseId);
    if (el.id === 'fb') { ui.fb = el.value; render(); }
    else if (el.id === 'f-status' && c) { if (c.status !== el.value) logChange(c, 'مرحله: ' + el.value); c.status = el.value; save(); render(); }
    else if (el.id === 'f-state' && c) { c.state = el.value; logChange(c, 'وضعیت: ' + (el.value || 'خودکار')); save(); render(); }
    else if (el.hasAttribute('data-docst') && c) { c.docs.forEach(function (d) { if (d.id === el.getAttribute('data-docst')) d.status = el.value; }); save(); }
    else if (el.id === 'sum-money') { ui.sumMoney = el.checked; render(); }
    else if (el.id === 'sum-notes') { ui.sumNotes = el.checked; render(); }
    else if (el.id === 'sum-inh') { ui.sumInh = el.checked; render(); }
    else if (el.id === 'cl-kind' || el.id === 'cl-subject') { updateClaimForm(); }
    else if (el.id === 'bk-file' && el.files[0]) { var fr = new FileReader(); fr.onload = function () { document.getElementById('bk-in').value = String(fr.result); toast('فایل خوانده شد - دکمه بازیابی را بزنید'); }; fr.readAsText(el.files[0]); }
    var f = el.closest('[data-form]'); if (f && (f.getAttribute('data-form') === 'calc' || f.getAttribute('data-form') === 'cd')) updatePrev(f.getAttribute('data-form'));
  });
  app.addEventListener('focusout', function (e) { var el = e.target; if (el.hasAttribute && el.hasAttribute('data-fee')) { var c = ui.caseId && cById(ui.caseId); if (c) el.value = c.fee ? money(c.fee) : ''; } });
  app.addEventListener('keydown', function (e) { if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('item') && e.target.hasAttribute('data-act')) { e.preventDefault(); e.target.click(); } });
  render();
})();
</script>
